[package]
name = "vaalstreet-setup"
version = "1.0.0"
description = "Vaal Street Setup"
authors = ["Waleed"]
edition = "2021"

[[bin]]
name = "VaalStreetSetup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
winreg = "0.55"
dirs = "6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
